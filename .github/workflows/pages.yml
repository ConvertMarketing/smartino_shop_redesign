name: Deploy preview pe GitHub Pages

on:
  push:
    branches:
      - main
      - claude/smartinoshop-redesign-prototype-5goztk
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Site de proiect → servit din /<nume-repo>/, deci prefixul e obligatoriu.
      - name: Build
        run: npx @11ty/eleventy
        env:
          PATH_PREFIX: /${{ github.event.repository.name }}/

      # NOTĂ: Pages trebuie activat o singură dată, manual:
      #   Settings → Pages → Build and deployment → Source: GitHub Actions
      # `enablement: true` nu funcționează aici — GITHUB_TOKEN-ul workflow-ului
      # poate publica pe un site Pages existent, dar nu are dreptul să creeze
      # unul ("Resource not accessible by integration").
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
